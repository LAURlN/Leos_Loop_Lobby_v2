# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup (see README.md "Deploy"):
#   1. Settings -> Pages -> Source: "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> Variables:
#      RELAY_URL = wss://leos-loop-lobby-relay.<your-subdomain>.workers.dev
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, exp_1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
